<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c26" />
      <stop offset="100%" stop-color="#0d0f15" />
    </linearGradient>

    <!-- Coral Fire Gradient (Math / Energy) -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a54" />
      <stop offset="60%" stop-color="#eb4d4b" />
      <stop offset="100%" stop-color="#d63031" />
    </linearGradient>

    <!-- Electric Cyan Gradient (Motion / Synthesis) -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="38" height="38" rx="10" fill="url(#bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />

  <!-- Coordinate Grid Lines (Subtle Math Plane) -->
  <line x1="19" y1="6" x2="19" y2="32" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="6" y1="19" x2="32" y2="19" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Central Graphic: Isometric Delta & Play Vector -->
  <g filter="url(#iconShadow)">
    <!-- Mathematical Harmonic Curve / Ascending Spine -->
    <path d="M 10 27 C 10 18, 14 11, 19 11 C 24 11, 28 18, 28 27" 
          stroke="url(#coralGrad)" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Forward Motion Playhead Chevron / Calculus Tangent -->
    <path d="M 13 21 L 24 16 L 24 26 Z" 
          fill="url(#cyanGrad)" opacity="0.95" />

    <!-- Origin Vertex Dot -->
    <circle cx="19" cy="11" r="2.2" fill="#ffffff" />
  </g>
</svg>
